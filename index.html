<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Watt's Up #16166 - FTC DECODE Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #080c14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #050811; }
        canvas { background: #0d1322; box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); border: 2px solid #00d2ff; border-radius: 8px; }
        
        /* HUD UI Elements */
        .hud { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        .brand { font-size: 20px; font-weight: 800; color: #ff6b00; text-shadow: 0 0 10px rgba(255,107,0,0.5); letter-spacing: 1px; }
        .brand span { color: #00d2ff; }
        .stats { display: flex; gap: 15px; }
        .stat-card { background: rgba(13, 19, 34, 0.85); border: 1px solid #00d2ff; padding: 8px 16px; border-radius: 6px; text-align: center; backdrop-filter: blur(5px); }
        .stat-value { font-size: 22px; font-weight: bold; color: #00d2ff; }
        .stat-value.score { color: #ff6b00; }
        .stat-label { font-size: 10px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Game Over Screen */
        #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 17, 0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        #game-over h1 { font-size: 48px; color: #ff6b00; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,107,0,0.6); }
        #game-over p { font-size: 20px; color: #00d2ff; margin-bottom: 25px; }
        .restart-btn { background: #ff6b00; color: #fff; border: none; padding: 14px 32px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255,107,0,0.5); transition: transform 0.2s, background 0.2s; pointer-events: auto; }
        .restart-btn:hover { background: #ff8533; transform: scale(1.05); }

        /* Mobile Controls */
        #touch-controls { position: absolute; bottom: 20px; left: 0; width: 100%; height: 160px; pointer-events: none; display: none; z-index: 20; }
        #joystick-zone { position: absolute; bottom: 20px; left: 30px; width: 120px; height: 120px; background: rgba(0, 210, 255, 0.15); border: 2px solid rgba(0, 210, 255, 0.4); border-radius: 50%; pointer-events: auto; touch-action: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #00d2ff; border-radius: 50%; box-shadow: 0 0 10px #00d2ff; }
        #shoot-btn { position: absolute; bottom: 30px; right: 30px; width: 100px; height: 100px; background: radial-gradient(circle, #ff6b00, #cc5200); border: 2px solid #ffaa66; border-radius: 50%; color: #fff; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; pointer-events: auto; box-shadow: 0 0 20px rgba(255,107,0,0.6); touch-action: manipulation; }
        #shoot-btn:active { transform: scale(0.92); background: #ff8533; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div class="brand">WATT'S UP <span>#16166</span></div>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value score" id="score-val">0</div>
                <div class="stat-label">SCORE</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="timer-val">2:00</div>
                <div class="stat-label" id="phase-val">AUTONOMOUS</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="inventory-val">0/3</div>
                <div class="stat-label">ARTEFACTS</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over">
        <h1>MATCH FINISHED</h1>
        <p>FINAL SCORE: <span id="final-score">0</span> PTS</p>
        <button class="restart-btn" onclick="resetGame()">RESTART MATCH</button>
    </div>

    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="shoot-btn">SHOOT</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game state variables
let score = 0;
let timeRemaining = 120; // 2 minutes
let gameActive = true;
let timerInterval = null;

// Scale and Arena Dimensions
const ARENA = { width: 800, height: 800 };
let scale = 1;

function resizeCanvas() {
    const minDim = Math.min(window.innerWidth - 20, window.innerHeight - 20);
    canvas.width = minDim;
    canvas.height = minDim;
    scale = minDim / ARENA.width;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Input handling
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space' && gameActive) shootArtifact();
    if (e.key.toLowerCase() === 'r' && !gameActive) resetGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Mobile Touch Detection
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.getElementById('touch-controls').style.display = 'block';
}

// Robot Object
const robot = {
    x: 400,
    y: 600,
    angle: -Math.PI / 2,
    radius: 30,
    speed: 0,
    maxSpeed: 4.5,
    rotSpeed: 0.06,
    inventory: []
};

// Goals/Baskets
const goals = [
    { name: "HIGH BASKET", x: 700, y: 100, radius: 55, pts: 100, color: "#ff6b00" },
    { name: "LOW BASKET", x: 720, y: 220, radius: 40, pts: 50, color: "#00d2ff" }
];

// Artifacts System
let artifacts = [];
let flyingArtifacts = [];

function spawnArtifacts(count = 5) {
    for (let i = 0; i < count; i++) {
        artifacts.push({
            x: 100 + Math.random() * 550,
            y: 150 + Math.random() * 500,
            radius: 10,
            color: Math.random() > 0.5 ? "#a855f7" : "#eab308"
        });
    }
}
spawnArtifacts(5);

function shootArtifact() {
    if (robot.inventory.length === 0) return;
    const artColor = robot.inventory.pop();
    
    flyingArtifacts.push({
        x: robot.x,
        y: robot.y,
        vx: Math.cos(robot.angle) * 12,
        vy: Math.sin(robot.angle) * 12,
        color: artColor,
        life: 0,
        maxLife: 35
    });
    
    document.getElementById('inventory-val').innerText = `${robot.inventory.length}/3`;
}

document.getElementById('shoot-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameActive) shootArtifact();
});

// Timer System
function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (!gameActive) return;
        timeRemaining--;
        
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-val').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        
        if (timeRemaining > 90) {
            document.getElementById('phase-val').innerText = "AUTONOMOUS";
            document.getElementById('phase-val').style.color = "#00d2ff";
        } else {
            document.getElementById('phase-val').innerText = "TELEOP";
            document.getElementById('phase-val').style.color = "#ff6b00";
        }
        
        if (timeRemaining <= 0) {
            endGame();
        }
    }, 1000);
}

function endGame() {
    gameActive = false;
    clearInterval(timerInterval);
    document.getElementById('final-score').innerText = score;
    document.getElementById('game-over').style.display = 'flex';
}

function resetGame() {
    score = 0;
    timeRemaining = 120;
    gameActive = true;
    robot.x = 400;
    robot.y = 600;
    robot.angle = -Math.PI / 2;
    robot.inventory = [];
    artifacts = [];
    flyingArtifacts = [];
    spawnArtifacts(5);
    
    document.getElementById('score-val').innerText = '0';
    document.getElementById('inventory-val').innerText = '0/3';
    document.getElementById('game-over').style.display = 'none';
    startTimer();
}

// Joystick logic
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false, joyVector = { x: 0, y: 0 };

joyZone.addEventListener('touchstart', handleJoyMove, {passive: false});
joyZone.addEventListener('touchmove', handleJoyMove, {passive: false});
joyZone.addEventListener('touchend', () => {
    joyActive = false;
    joyKnob.style.transform = `translate(0px, 0px)`;
    joyVector = { x: 0, y: 0 };
});

function handleJoyMove(e) {
    e.preventDefault();
    joyActive = true;
    const rect = joyZone.getBoundingClientRect();
    const touch = e.touches[0];
    let dx = touch.clientX - (rect.left + rect.width / 2);
    let dy = touch.clientY - (rect.top + rect.height / 2);
    const dist = Math.hypot(dx, dy);
    const maxR = 35;
    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVector = { x: dx / maxR, y: dy / maxR };
}

// Update game loop
function update() {
    if (!gameActive) return;

    // Controls Update
    if (keys['w'] || keys['arrowup']) robot.speed = Math.min(robot.speed + 0.3, robot.maxSpeed);
    else if (keys['s'] || keys['arrowdown']) robot.speed = Math.max(robot.speed - 0.3, -robot.maxSpeed * 0.5);
    else robot.speed *= 0.88;

    if (keys['a'] || keys['arrowleft']) robot.angle -= robot.rotSpeed;
    if (keys['d'] || keys['arrowright']) robot.angle += robot.rotSpeed;

    if (joyActive) {
        robot.speed = -joyVector.y * robot.maxSpeed;
        robot.angle += joyVector.x * robot.rotSpeed * 1.5;
    }

    // Move Robot
    robot.x += Math.cos(robot.angle) * robot.speed;
    robot.y += Math.sin(robot.angle) * robot.speed;

    // Arena Boundaries
    robot.x = Math.max(robot.radius, Math.min(ARENA.width - robot.radius, robot.x));
    robot.y = Math.max(robot.radius, Math.min(ARENA.height - robot.radius, robot.y));

    // Artifact Collection
    for (let i = artifacts.length - 1; i >= 0; i--) {
        const art = artifacts[i];
        const dist = Math.hypot(robot.x - art.x, robot.y - art.y);
        if (dist < robot.radius + art.radius && robot.inventory.length < 3) {
            robot.inventory.push(art.color);
            artifacts.splice(i, 1);
            document.getElementById('inventory-val').innerText = `${robot.inventory.length}/3`;
        }
    }

    // Auto-Respawn artifacts when empty
    if (artifacts.length === 0) {
        spawnArtifacts(5);
    }

    // Update Flying Projectiles
    for (let i = flyingArtifacts.length - 1; i >= 0; i--) {
        const fa = flyingArtifacts[i];
        fa.x += fa.vx;
        fa.y += fa.vy;
        fa.life++;

        if (fa.life >= fa.maxLife) {
            // Check basket scoring
            goals.forEach(goal => {
                const dist = Math.hypot(fa.x - goal.x, fa.y - goal.y);
                if (dist < goal.radius) {
                    score += goal.pts;
                    document.getElementById('score-val').innerText = score;
                }
            });
            flyingArtifacts.splice(i, 1);
        }
    }
}

// Render game
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(scale, scale);

    // Draw Grid Background
    ctx.strokeStyle = "rgba(0, 210, 255, 0.08)";
    ctx.lineWidth = 1;
    for (let x = 0; x < ARENA.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ARENA.height); ctx.stroke();
    }
    for (let y = 0; y < ARENA.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ARENA.width, y); ctx.stroke();
    }

    // Draw Goals
    goals.forEach(goal => {
        ctx.beginPath();
        ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(13, 19, 34, 0.7)";
        ctx.fill();
        ctx.strokeStyle = goal.color;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = goal.color;
        ctx.font = "bold 12px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText(goal.name, goal.x, goal.y - 5);
        ctx.fillText(`+${goal.pts} PTS`, goal.x, goal.y + 12);
    });

    // Draw Floor Artifacts
    artifacts.forEach(art => {
        ctx.beginPath();
        ctx.arc(art.x, art.y, art.radius, 0, Math.PI * 2);
        ctx.fillStyle = art.color;
        ctx.shadowColor = art.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Draw Flying Artifacts
    flyingArtifacts.forEach(fa => {
        ctx.beginPath();
        ctx.arc(fa.x, fa.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = fa.color;
        ctx.shadowColor = fa.color;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Draw Robot (Watt's Up #16166)
    ctx.save();
    ctx.translate(robot.x, robot.y);
    ctx.rotate(robot.angle);

    // Aiming Line
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(200, 0);
    ctx.strokeStyle = "rgba(255, 107, 0, 0.3)";
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Robot Body
    ctx.fillStyle = "#ff6b00";
    ctx.fillRect(-robot.radius, -robot.radius, robot.radius * 2, robot.radius * 2);
    ctx.strokeStyle = "#00d2ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(-robot.radius, -robot.radius, robot.radius * 2, robot.radius * 2);

    // Front Indicator Arrow
    ctx.beginPath();
    ctx.moveTo(robot.radius, -10);
    ctx.lineTo(robot.radius + 15, 0);
    ctx.lineTo(robot.radius, 10);
    ctx.fillStyle = "#00d2ff";
    ctx.fill();

    // Team Number Label
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText("16166", 0, 4);

    ctx.restore();
    ctx.restore();

    requestAnimationFrame(render);
}

function render() {
    update();
    draw();
}

startTimer();
requestAnimationFrame(render);
</script>
</body>
</html>
